<!doctype html>
<html lang="zh-CN" data-theme="jade">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>写作文稿卡片与删除隔离验收</title>
<style>
html,body{height:100%;margin:0;overflow:hidden}#writing-projects-result{height:32px;box-sizing:border-box;overflow:auto;margin:0;padding:5px 12px;font:11px/1.5 monospace;background:#eef5f0;color:#294235}#writing-projects-root{height:calc(100vh - 32px)}
.projects-fixture-shell{height:100%;display:flex;flex-direction:column;min-height:0}.projects-fixture-controls{display:flex;align-items:center;gap:12px;padding:8px 16px;font:12px/1.6 sans-serif;flex-shrink:0;background:#f7faf7;border-bottom:1px solid #cbd7ce;color:#294235}.projects-fixture-controls button,.projects-fixture-controls select{font:inherit;background:white;border:1px solid #bdcbbc;border-radius:5px;padding:4px 8px}.projects-fixture-layout{display:grid;grid-template-columns:210px minmax(0,1fr);flex:1;min-height:0}.projects-fixture-sidebar{padding:32px 24px;border-right:1px solid var(--line);color:var(--green);font-size:15px;background:var(--surface)}.projects-fixture-main{overflow:auto;min-height:0;min-width:0}.projects-fixture-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#294b3b;color:white;padding:10px 18px;border-radius:8px;z-index:100;font-size:14px}
</style></head>
<body><pre id="writing-projects-result" data-status="running">RUNNING · 所有请求仅使用内存样本</pre><div id="writing-projects-root"></div><script type="module" src="./writing-projects-harness.jsx"></script></body>
</html>
