name: ${WENSHU_COMPOSE_PROJECT:-wenshu}

x-backend: &backend
  image: ${WENSHU_BACKEND_IMAGE:-wenshu-api:dev}
  build:
    context: ../..
    dockerfile: deploy/server/Dockerfile
  network_mode: host
  user: "${WENSHU_UID:-1000}:${WENSHU_GID:-1000}"
  working_dir: /workspace
  volumes:
    - ${WENSHU_SOURCE_ROOT:-../..}:/workspace
    - ${WENSHU_DATA_PATH:-../../data/wenshu}:/var/lib/wenshu
  environment: &backend-environment
    WENSHU_DATA_DIR: /var/lib/wenshu
    WENSHU_RERANK_URL: ${WENSHU_RERANK_URL:-http://127.0.0.1:8788}
    WENSHU_ALLOWED_HOSTS: ${WENSHU_ALLOWED_HOSTS:-}
    WENSHU_ALLOWED_ORIGINS: ${WENSHU_ALLOWED_ORIGINS:-}
    WENSHU_OPERATIONS_ALLOWED_HOSTS: ${WENSHU_OPERATIONS_ALLOWED_HOSTS:-}
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  api:
    <<: *backend
    command: [python, -m, uvicorn, server.app:app, --host, 127.0.0.1, --port, "${WENSHU_API_PORT:-8787}"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${WENSHU_API_PORT:-8787}/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 15s
  worker:
    <<: *backend
    command: python -m server.worker
    depends_on:
      api:
        condition: service_healthy
  frontend:
    image: node:22-bookworm-slim@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
    network_mode: host
    user: "${WENSHU_UID:-1000}:${WENSHU_GID:-1000}"
    working_dir: /workspace/frontend
    volumes:
      - ${WENSHU_SOURCE_ROOT:-../..}:/workspace
    environment:
      HOME: /tmp
      WENSHU_FRONTEND_HOST: ${WENSHU_FRONTEND_HOST:-127.0.0.1}
      WENSHU_API_PROXY_TARGET: http://127.0.0.1:${WENSHU_API_PORT:-8787}
      WENSHU_ALLOWED_HOSTS: ${WENSHU_ALLOWED_HOSTS:-}
      WENSHU_OPERATIONS_ALLOWED_HOSTS: ${WENSHU_OPERATIONS_ALLOWED_HOSTS:-}
    command: npm run dev -- --port ${WENSHU_FRONTEND_PORT:-4173} --strictPort
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
